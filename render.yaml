services:
  - type: web
    name: face-search-pro
    runtime: python
    plan: standard
    pythonVersion: 3.10.0
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 2 app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    disk:
      name: face-index
      mountPath: /app/data
      sizeGB: 10
